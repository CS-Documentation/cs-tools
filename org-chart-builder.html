<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Org Chart Builder — Connected Stars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1446a0;--brand-dark:#0d3278;--brand-mid:#2d5bbf;--brand-light:#e8eef8;
  --bg:#f4f6fb;--surface:#fff;
  --text:#1a1a2e;--text2:#4a5568;--text3:#6b7280;
  --border:#dde3ef;--border2:#b8c5e0;
  --green:#27ae60;--amber:#e67e22;--red:#c0392b;--purple:#7b2d8b;--teal:#0e7490;
  --r:10px;--rs:8px;
  --sh:0 2px 12px rgba(20,70,160,.08);--sh-md:0 4px 16px rgba(20,70,160,.12);--sh-lg:0 20px 60px rgba(0,0,0,.25);
  --z:1;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-mid);outline-offset:1px}

#app{display:grid;grid-template-columns:78px minmax(0,1fr) 304px;grid-template-rows:auto minmax(0,1fr) auto;height:100vh}

/* ---------- top bar ---------- */
.topbar{grid-column:1/-1;background:linear-gradient(135deg,var(--brand-dark) 0%,var(--brand) 55%,var(--brand-mid) 100%);color:#fff;display:flex;align-items:center;gap:8px 14px;padding:7px 14px;flex-wrap:wrap}
.tb-brand{display:flex;align-items:center;gap:10px;min-width:0}
.tb-brand img{height:40px;max-width:150px;object-fit:contain;object-position:left center}
.tb-title{display:flex;flex-direction:column;line-height:1.15}
.tb-title strong{font-weight:700;font-size:15px}
.tb-title span{font-size:11px;opacity:.85}
.tb-name{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:180px;max-width:440px}
.tb-name input{flex:1;min-width:0;padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:14px}
.tb-name input::placeholder{color:rgba(255,255,255,.6)}
.tb-name input:focus{background:#fff;color:var(--text);outline:none}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;background:rgba(255,255,255,.18);white-space:nowrap}
.chip.dirty{background:#fde7c8;color:#8a4b00}
.chip.ok{background:#d6f3e1;color:#14683a}
.tb-group{display:flex;gap:5px;align-items:center}
.tb-group.sp{margin-left:auto}
.tbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:18px;padding:5px 12px;font-size:12.5px;font-weight:700;min-height:30px;white-space:nowrap}
.tbtn:hover:not(:disabled){background:rgba(255,255,255,.28)}
.tbtn:disabled{opacity:.4;cursor:default}
.tbtn.primary{background:#fff;color:var(--brand)}
.tbtn.primary:hover{background:var(--brand-light)}
.tbtn.sq{padding:5px 9px}
.zlabel{font-size:12px;font-weight:700;min-width:44px;text-align:center}

/* ---------- tool rail ---------- */
.tools{background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:4px;padding:8px 5px;overflow-y:auto}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border:1px solid transparent;background:none;border-radius:8px;color:var(--text2);font-size:10.5px;font-weight:700;line-height:1.1;text-align:center}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--brand-light);color:var(--brand)}
.tool.on{background:var(--brand);color:#fff}
.tool-sep{height:1px;background:var(--border);margin:4px 6px}

/* ---------- workspace / sheet ---------- */
#workspace{background:#d6deee;overflow:auto;position:relative;user-select:none;-webkit-user-select:none}
#workspace.panning{cursor:grabbing}
#workspace.spacepan{cursor:grab}
#wrap{position:relative}
#sheet{position:absolute;background:#fff;box-shadow:0 4px 28px rgba(20,40,90,.22);transform-origin:0 0;touch-action:none}
#sheet.grid{background-image:linear-gradient(to right,rgba(20,70,160,.08) 1px,transparent 1px),linear-gradient(to bottom,rgba(20,70,160,.08) 1px,transparent 1px);background-size:var(--g,10px) var(--g,10px)}
#sheet.connecting,#sheet.connecting .item{cursor:crosshair!important}
#conn{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#conn .hit{pointer-events:stroke;cursor:pointer}
#items{position:absolute;left:0;top:0}
#overlay{position:absolute;left:0;top:0;width:0;height:0;overflow:visible;pointer-events:none}

/* ---------- items (shared by editor and print) ---------- */
.item{position:absolute;overflow:hidden;line-height:1.28;overflow-wrap:anywhere;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.item .f{outline:none;white-space:pre-wrap;min-width:1px}
.item .f:empty{display:none}
.item.box .name{line-height:1.2}
.item.box .role{margin-top:2px}
.item.box .info{margin-top:7px}
.item .acc{position:absolute;display:none}
.item img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
#sheet .item{cursor:move}
#sheet .item:hover{outline:calc(1.5px/var(--z)) solid rgba(45,91,191,.45)}
#sheet .item.editing{cursor:text;overflow:visible;user-select:text;-webkit-user-select:text;outline:calc(2px/var(--z)) solid var(--brand-mid)}
#sheet .item.editing .f{display:block;min-height:1.25em;cursor:text}
#sheet .item.editing .f:empty::before{content:attr(data-ph);opacity:.4}

/* selection overlay */
.selbox{position:absolute;outline:calc(2px/var(--z)) solid var(--brand-mid);outline-offset:calc(1px/var(--z))}
.selbox.multi{outline-style:dashed}
.drop{position:absolute;outline:calc(3px/var(--z)) solid var(--green);outline-offset:calc(2px/var(--z));background:rgba(39,174,96,.08)}
.drop.src{outline-color:var(--amber);background:rgba(230,126,34,.08)}
.rh{position:absolute;width:calc(10px/var(--z));height:calc(10px/var(--z));background:#fff;border:calc(1.5px/var(--z)) solid var(--brand);border-radius:calc(2px/var(--z));transform:translate(-50%,-50%);pointer-events:auto}
.rh[data-h=n],.rh[data-h=s]{cursor:ns-resize}
.rh[data-h=e],.rh[data-h=w]{cursor:ew-resize}
.rh[data-h=ne],.rh[data-h=sw]{cursor:nesw-resize}
.rh[data-h=nw],.rh[data-h=se]{cursor:nwse-resize}
.ep{position:absolute;width:calc(14px/var(--z));height:calc(14px/var(--z));border-radius:50%;background:#fff;border:calc(2.5px/var(--z)) solid var(--brand);transform:translate(-50%,-50%);pointer-events:auto;cursor:crosshair}
.guide{position:absolute;background:#e0457b}
.guide.v{width:calc(1px/var(--z))}
.guide.h{height:calc(1px/var(--z))}
.marq{position:absolute;border:calc(1px/var(--z)) solid var(--brand-mid);background:rgba(45,91,191,.1)}

/* ---------- inspector ---------- */
#inspector{background:#fff;border-left:1px solid var(--border);overflow-y:auto;padding:0 0 24px}
.ihead{padding:12px 14px 8px;font-weight:700;font-size:13px;color:var(--brand);position:sticky;top:0;background:#fff;z-index:2;border-bottom:1px solid var(--border)}
.grp{border-bottom:1px solid var(--border)}
.grp>summary{list-style:none;cursor:pointer;padding:9px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);display:flex;justify-content:space-between;align-items:center}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:'▾';font-size:11px}
.grp:not([open])>summary::after{content:'▸'}
.gb{padding:2px 14px 12px}
.fld{margin-bottom:9px}
.lbl{font-size:11px;font-weight:700;color:var(--text3);margin-bottom:3px}
.lbl .rv{font-weight:500;color:var(--text2);margin-left:4px}
.in{width:100%;padding:6px 8px;border:1px solid var(--border2);border-radius:6px;background:#fff;min-width:0}
textarea.in{resize:vertical;line-height:1.35}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.nf{display:block;margin-bottom:9px}
.nf>span{display:block;font-size:11px;font-weight:700;color:var(--text3);margin-bottom:3px}
input[type=range]{width:100%;accent-color:var(--brand)}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:7px;font-size:13px}
.cc{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.sw{width:18px;height:18px;border-radius:5px;border:1px solid var(--border2);padding:0}
.sw.on{outline:2px solid var(--brand);outline-offset:1px}
.sw.none{background:linear-gradient(135deg,#fff 45%,var(--red) 45%,var(--red) 55%,#fff 55%)}
.cc input[type=color]{width:30px;height:22px;padding:0;border:1px solid var(--border2);border-radius:5px;background:#fff;cursor:pointer}
.seg{display:flex;border:1px solid var(--border2);border-radius:7px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:6px 4px;font-size:12px;font-weight:700;color:var(--text2);border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brand);color:#fff}
.seg button:hover:not(.on){background:var(--brand-light)}
.tgs{display:flex;gap:5px;margin-bottom:9px;flex-wrap:wrap}
.tg{border:1px solid var(--border2);background:#fff;border-radius:6px;padding:5px 10px;font-weight:700;font-size:12px;color:var(--text2)}
.tg.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn{border:1px solid var(--border2);background:#fff;border-radius:8px;padding:7px 12px;font-weight:700;font-size:12.5px;color:var(--text)}
.btn:hover{background:var(--brand-light);border-color:var(--brand-mid)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-dark)}
.btn.danger{color:var(--red);border-color:#e6b8b3}
.btn.danger:hover{background:#fdf0ef}
.btn.wide{width:100%;margin-bottom:6px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.btns .btn{flex:1 1 auto}
.ico-row{display:flex;gap:4px;margin-bottom:8px}
.ico-row button{flex:1;border:1px solid var(--border2);background:#fff;border-radius:6px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.ico-row button:hover{background:var(--brand-light);color:var(--brand)}
.ico-row svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}
.theme{height:30px;border-radius:6px;border:2px solid;font-weight:700;font-size:12px;border-top-width:5px}
.theme:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.note{font-size:12px;color:var(--text3);line-height:1.45;margin-bottom:8px}
.note b{color:var(--text2)}
kbd{font-family:'DM Mono',ui-monospace,monospace;font-size:11px;background:#eef1f8;border:1px solid var(--border2);border-bottom-width:2px;border-radius:4px;padding:0 4px}

/* ---------- status bar / toasts ---------- */
.statusbar{grid-column:1/-1;background:#fff;border-top:1px solid var(--border);padding:5px 12px;display:flex;gap:14px;align-items:center;font-size:12px;color:var(--text3)}
.statusbar #hint{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folderchip{border:1px solid var(--border2);background:var(--brand-light);color:var(--brand-dark);border-radius:14px;padding:3px 11px;font-weight:700;font-size:12px;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folderchip:hover{background:#d8e3f6}
.folderchip.warn{background:#fde7c8;border-color:#e9c58e;color:#8a4b00}
#toasts{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:50;pointer-events:none}
.toast{background:var(--text);color:#fff;padding:9px 16px;border-radius:10px;box-shadow:var(--sh-lg);font-size:13px;max-width:min(560px,92vw);transition:opacity .35s}
.toast.err{background:var(--red)}
.toast.out{opacity:0}

/* ---------- dialogs ---------- */
dialog{border:0;border-radius:14px;box-shadow:var(--sh-lg);padding:0;max-width:min(580px,94vw);width:100%;color:var(--text);margin:auto}
dialog::backdrop{background:rgba(13,50,120,.38)}
.dform{padding:20px 22px}
.dform h3{color:var(--brand);font-size:18px;margin-bottom:10px;font-weight:700}
.dbody{font-size:13.5px;line-height:1.5;color:var(--text2);max-height:62vh;overflow:auto}
.dbody p{margin-bottom:8px}
.dbody h4{color:var(--text);margin:12px 0 4px;font-size:13px}
.dbody ul{margin:0 0 6px 18px}
.dbody li{margin-bottom:3px}
.dfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.clist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.clist button{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--border2);background:#fff;border-radius:9px;padding:10px 12px}
.clist button:hover{background:var(--brand-light);border-color:var(--brand-mid)}
.clist b{color:var(--text);font-size:14px}
.clist span{font-size:12px;color:var(--text3);white-space:nowrap}

/* ---------- print ---------- */
#printRoot{display:none}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  #app,dialog,#toasts{display:none!important}
  #printRoot{display:block!important}
  .psheet{position:relative;overflow:hidden;break-inside:avoid;page-break-after:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .psheet svg{position:absolute;left:0;top:0;overflow:visible}
}
</style>
<style id="pageStyle"></style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="tb-brand">
      <img src="https://raw.githubusercontent.com/CS-Documentation/invoice/refs/heads/main/front%20page%20header.png" alt="Connected Stars" onerror="this.style.display='none'">
      <div class="tb-title"><strong>Org Chart Builder</strong><span>Connected Stars</span></div>
    </div>
    <div class="tb-name">
      <input id="chartName" type="text" placeholder="Chart name" aria-label="Chart name" maxlength="80">
      <span id="saveChip" class="chip">New chart</span>
    </div>
    <div class="tb-group">
      <button class="tbtn" data-act="new">New</button>
      <button class="tbtn" data-act="open">Open…</button>
      <button class="tbtn primary" data-act="save" title="Save (Ctrl+S)">Save</button>
      <button class="tbtn" data-act="saveas" title="Save a copy under a new name, e.g. a new version">Save as…</button>
      <button class="tbtn" data-act="pdf" title="Opens the print window — choose “Save as PDF”">Export PDF</button>
    </div>
    <div class="tb-group sp">
      <button class="tbtn sq" id="btnUndo" data-act="undo" title="Undo (Ctrl+Z)">↶</button>
      <button class="tbtn sq" id="btnRedo" data-act="redo" title="Redo (Ctrl+Y)">↷</button>
    </div>
    <div class="tb-group">
      <button class="tbtn sq" data-act="zoomout" title="Zoom out">−</button>
      <span class="zlabel" id="zlabel">100%</span>
      <button class="tbtn sq" data-act="zoomin" title="Zoom in">+</button>
      <button class="tbtn" data-act="fit" title="Fit the page in the window">Fit</button>
      <button class="tbtn sq" data-act="help" title="Help and shortcuts">?</button>
    </div>
  </header>

  <nav class="tools" aria-label="Add to chart">
    <button class="tool" data-tool="box" title="Add a staff box (name, role, other information)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M7 13h7M7 16h4"/></svg>Staff box</button>
    <button class="tool" data-tool="textbox" title="Add a text box with a border"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" stroke-dasharray="3 2"/><path d="M8 9h8M12 9v7"/></svg>Text box</button>
    <button class="tool" data-tool="text" title="Add plain text with no border"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M9 19h6"/></svg>Plain text</button>
    <button class="tool" data-tool="image" title="Add a picture, e.g. a logo"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>Picture</button>
    <div class="tool-sep"></div>
    <button class="tool" data-tool="line" title="Add a free line you can place anywhere"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="1.8"/><circle cx="19" cy="5" r="1.8"/></svg>Line</button>
    <button class="tool" id="toolConnect" data-tool="connect" title="Join boxes: click the manager box, then the person who reports to them"><svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="5" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/><rect x="14" y="16" width="7" height="5" rx="1"/><path d="M12 8v4M6.5 16v-4h11v4"/></svg>Join boxes</button>
    <div class="tool-sep"></div>
    <button class="tool" data-tool="tidy" title="Neatly arrange everything that is joined together as a tree (you can undo)"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>Tidy up</button>
  </nav>

  <main id="workspace">
    <div id="wrap">
      <div id="sheet">
        <svg id="conn" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="items"></div>
        <div id="overlay"></div>
      </div>
    </div>
  </main>

  <aside id="inspector" aria-label="Properties"></aside>

  <footer class="statusbar">
    <span id="hint"></span>
    <button class="folderchip" id="folderChip" type="button"></button>
  </footer>
</div>

<div id="toasts" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<input type="file" id="imgIn" accept="image/*" hidden>
<div id="printRoot"></div>

<script>
(() => {
'use strict';

/* =========================================================================
   Helpers and constants
   ========================================================================= */
const APP = 'cs-org-chart', LSK = 'csOrgChart.', PAD = 360;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = p => p + Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const num = (v, d) => (Number.isFinite(+v) ? +v : d);
const clone = o => JSON.parse(JSON.stringify(o));
const f2 = v => Math.round(v * 100) / 100;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mm2px = mm => Math.round(mm * 96 / 25.4);

// Paper sizes in mm, long edge first (landscape).
const PAGES = { A4: [297, 210], A3: [420, 297], A2: [594, 420], Letter: [279.4, 215.9] };
const SWATCHES = ['#ffffff', '#e8eef8', '#1446a0', '#27ae60', '#e67e22', '#c0392b', '#7b2d8b', '#0e7490', '#1a1a2e', '#6b7280'];

// One-click looks for staff boxes.
const THEMES = [
  { n: 'Blue',   p: { fill: '#e8eef8', stroke: '#1446a0', accentColor: '#1446a0', color: '#0d3278', roleColor: '#2d5bbf', infoColor: '#4a5568' } },
  { n: 'Solid',  p: { fill: '#1446a0', stroke: '#1446a0', accentColor: '#e8eef8', color: '#ffffff', roleColor: '#dbe6fb', infoColor: '#c5d4f2' } },
  { n: 'Green',  p: { fill: '#eafaf1', stroke: '#27ae60', accentColor: '#27ae60', color: '#145a32', roleColor: '#1e8449', infoColor: '#4a5568' } },
  { n: 'Amber',  p: { fill: '#fef5e7', stroke: '#e67e22', accentColor: '#e67e22', color: '#7e4a0a', roleColor: '#a85a0a', infoColor: '#4a5568' } },
  { n: 'Red',    p: { fill: '#fdf0ef', stroke: '#c0392b', accentColor: '#c0392b', color: '#7b241c', roleColor: '#c0392b', infoColor: '#4a5568' } },
  { n: 'Purple', p: { fill: '#f5eef8', stroke: '#7b2d8b', accentColor: '#7b2d8b', color: '#4a1a55', roleColor: '#7b2d8b', infoColor: '#4a5568' } },

      cx.drawImage(im, 0, 0, cv.width, cv.height);
      const id = uid('a');

      if (imgReplace && primary('image')) {
        const it = primary('image'); it.asset = id;
        const r = im.width / im.height; it.h = Math.round(it.w / r);

async function listCharts(dir) {

    if (h.kind !== 'file' || !/\.json$/i.test(name)) continue;
    try {
      const f = await h.getFile();
      if (f.size > 80e6) continue;
      const d = JSON.parse(await f.text());
      if (d && d.app === APP) out.push({ name, mod: f.lastModified, items: (d.items || []).length });

    it.align = oneOf(it.align, ['left', 'center', 'right'], base.align || 'left');
    if (t === 'box') it.accent = oneOf(it.accent, ['none', 'top', 'left'], 'top');
    ['strokeW', 'radius', 'pad', 'nameSize', 'roleSize', 'infoSize', 'fontSize'].forEach(k => { if (it[k] !== undefined) it[k] = clamp(num(it[k], base[k] !== undefined ? base[k] : 0), 0, 400); });
    ['name', 'role', 'info', 'text'].forEach(k => { if (it[k] !== undefined) it[k] = String(it[k]).slice(0, 5000); });
    ['bold', 'italic', 'underline', 'shadow'].forEach(k => { if (it[k] !== undefined) it[k] = !!it[k]; });
    it.autoH = t !== 'image' && !!it.autoH;
    if (t === 'image') it.asset = typeof it.asset === 'string' ? it.asset : '';
    return it;
  });
  const ids = new Set(items.map(i => i.id));
  const SIDES = ['auto', 'top', 'right', 'bottom', 'left'];
  const end = e => (e && e.item ? { item: safeId(e.item, 'i') } : { x: num(e && e.x, 0), y: num(e && e.y, 0) });
  const conns = (Array.isArray(d.connectors) ? d.connectors : []).filter(c => c && c.a && c.b).map(c => ({
    id: safeId(c.id, 'c'), a: end(c.a), b: end(c.b), sa: oneOf(c.sa, SIDES, 'auto'), sb: oneOf(c.sb, SIDES, 'auto'),
    bend: clamp(num(c.bend, 0.5), 0.05, 0.95), style: oneOf(c.style, ['elbow', 'straight', 'curve'], 'elbow'),
    color: colour(c.color, CONN_DEF.color), width: clamp(num(c.width, 2), 0.5, 20), dash: oneOf(c.dash, ['solid', 'dashed', 'dotted'], 'solid'),
    arrow: oneOf(c.arrow, ['none', 'end', 'start', 'both'], 'none'), radius: clamp(num(c.radius, 8), 0, 60)
  })).filter(c => (!c.a.item || ids.has(c.a.item)) && (!c.b.item || ids.has(c.b.item)));
  const as = {};
  Object.entries(d.assets && typeof d.assets === 'object' ? d.assets : {}).forEach(([k, v]) => { if (typeof v === 'string' && /^data:image\//.test(v)) as[safeId(k, 'a')] = v; });
  return { name: String(d.name || 'Untitled chart').slice(0, 80), page, items, conns, assets: as };
}
function loadDoc(d, file, isDirty) {
  if (editingId) endEdit();
  Object.assign(assets, d.assets || {});
  doc = { name: d.name, page: d.page, items: d.items, conns: d.conns };
  sel = []; selConn = null; currentFile = file || null; dirty = !!isDirty;
  setConnectMode(false);
  $('#chartName').value = doc.name;
  itemEls.forEach(el => el.remove()); itemEls.clear();
  resetHistory(); refreshAll(); fitView(); updateChip();
}
function loadFromText(text, fname, fromFolder) {
  let d;
  try { d = normalise(JSON.parse(text)); } catch (e) { toast(e instanceof SyntaxError ? 'That file could not be read.' : e.message, 'err'); return; }
  if (fname) d.name = fname.replace(/\.json$/i, '');
  loadDoc(d, fromFolder ? fname : null, false);
  scheduleDraft();
  toast('Opened “' + d.name + '”.');
}
function newChart() {
  if (dirty && !confirm('You have changes that are not saved to a file. Start a new blank chart anyway?')) return;
  const d = blankDoc();
  loadDoc({ name: d.name, page: d.page, items: [], conns: [], assets: {} }, null, false);
  scheduleDraft();
}

/* ---- drafts (a safety net in this browser, never a substitute for Save) ---- */
let draftT = 0, draftWarned = false;
function scheduleDraft() { clearTimeout(draftT); draftT = setTimeout(writeDraft, 600); }
function writeDraft() {
  if (!saveJSON(LSK + 'draft', { doc: serializeDoc(), file: currentFile, dirty }) && !draftWarned) { draftWarned = true; toast('This chart is too big for the automatic browser backup. Use Save to keep it safe.', 'err'); }
}
function markDirty() { dirty = true; updateChip(); scheduleDraft(); }
function updateChip() {
  const c = $('#saveChip');
  c.className = 'chip ' + (dirty ? 'dirty' : currentFile ? 'ok' : '');
  c.textContent = dirty ? '● Unsaved changes' : currentFile ? '✓ Saved' : 'New chart';
  c.title = currentFile ? 'File: ' + currentFile : 'Not saved to a file yet';
  document.title = (dirty ? '• ' : '') + doc.name + ' — Org Chart Builder';
}
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
$('#chartName').addEventListener('input', e => { doc.name = e.target.value; updateChip(); });
$('#chartName').addEventListener('change', e => { doc.name = e.target.value.trim() || 'Untitled chart'; e.target.value = doc.name; commit(); });
$('#chartName').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

/* =========================================================================
   PDF (via the browser's print window → Save as PDF)
   ========================================================================= */
function preparePrint() {
  const p = doc.page, root = $('#printRoot');
  root.innerHTML = '';
  const sheet = document.createElement('div');
  sheet.className = 'psheet';
  sheet.style.cssText = 'width:' + p.w + 'px;height:' + (p.h - 2) + 'px;background:' + p.bg;
  sheet.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="' + p.w + '" height="' + p.h + '">' + connsMarkup(false) + '</svg>';
  doc.items.forEach(it => { const el = makeItemEl(it); sheet.appendChild(el); applyItem(el, it, { fixedH: true }); });
  root.appendChild(sheet);
  const size = PAGES[p.size] ? (p.landscape ? PAGES[p.size][0] + 'mm ' + PAGES[p.size][1] + 'mm' : PAGES[p.size][1] + 'mm ' + PAGES[p.size][0] + 'mm') : p.w + 'px ' + p.h + 'px';
  $('#pageStyle').textContent = '@page{size:' + size + ';margin:0}';
}
async function exportPDF() {
  if (editingId) endEdit();
  if (!doc.items.length) { toast('Add something to the chart first.'); return; }
  preparePrint();
  toast('In the print window, set the destination to “Save as PDF”.');
  await Promise.all($$('#printRoot img').map(im => (im.decode ? im.decode().catch(() => {}) : null)));
  setTimeout(() => window.print(), 250);
}
window.addEventListener('beforeprint', preparePrint);

/* =========================================================================
   Starter chart (first visit only)
   ========================================================================= */
function starter() {
  const d = blankDoc(); d.name = 'Staffing structure';
  doc = d;
  const title = mkText(40, 30, false); title.text = 'Staffing structure'; title.fontSize = 26; title.bold = true; title.color = '#0d3278'; title.w = 520;
  const mk = (name, role, info, theme, w) => { const b = mkBox(0, 120); b.name = name; b.role = role; b.info = info; Object.assign(b, THEMES[theme].p); if (w) b.w = w; return b; };
  const rm = mk('Staff name', 'Registered Manager', '', 1), dm = mk('Staff name', 'Deputy Manager', '', 0), ad = mk('Staff name', 'Administrator', 'Part time', 7);
  const t1 = mk('Staff name', 'Team Leader', 'Unit A', 2), t2 = mk('Staff name', 'Team Leader', 'Unit B', 3);
  const s1 = mk('Support workers', '', '6 staff', 8), s2 = mk('Support workers', '', '5 staff', 8);
  [rm, dm, ad, t1, t2, s1, s2].forEach((b, i) => { b.x = 40 + i * 230; });
  d.items = [title, rm, dm, ad, t1, t2, s1, s2];
  [[rm, dm], [rm, ad], [dm, t1], [dm, t2], [t1, s1], [t2, s2]].forEach(([a, b]) => addConn(a.id, b.id));
  const note = mkText(40, 700, true); note.text = 'Add, move and restyle anything. Lines are optional — delete this note when you start.'; note.w = 420; note.fontSize = 13; note.color = '#4a5568';
  d.items.push(note);
  return d;
}

/* =========================================================================
   Start up
   ========================================================================= */
function boot() {
  const draft = loadJSON(LSK + 'draft');
  let loaded = false;
  if (draft && draft.doc) {
    try { loadDoc(normalise(draft.doc), draft.file, draft.dirty); loaded = true; if (draft.dirty) toast('Restored your unsaved work from this browser.'); } catch (e) { /* fall through to the starter */ }
  }
  if (!loaded) {
    const d = starter();
    doc = blankDoc();
    loadDoc({ name: d.name, page: d.page, items: d.items, conns: d.conns, assets: {} }, null, false);
    // lay the starter out as a tree, then forget that step so Undo starts clean
    tidy(null, true);
    resetHistory(); dirty = false; updateChip();
  }
  fitView(); updateHint(); initFolder();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { syncItems(); renderConns(); renderOverlay(); });
}
window.addEventListener('resize', () => { applyPageView(); });
boot();
window.__orgChart = { get doc() { return doc; }, preparePrint, tidy, get sel() { return sel; } };
})();
</script>
</body>
