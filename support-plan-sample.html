<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Interactive Support Plan (sample)</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --brand:#1446a0;--brand-dark:#0d3278;--brand-mid:#2d5bbf;--brand-light:#e8eef8;
  --bg:#f4f6fb;--surface:#fff;--surface2:#f7f9fc;--surface3:#edf0f7;
  --text:#1a1a2e;--text2:#4a5568;--text3:#5b6472;
  --border:#dde3ef;--border2:#b8c5e0;
  --green:#27ae60;--green-bg:#eafaf1;--green-strong:#1e8449;
  --amber:#e67e22;--amber-bg:#fef5e7;--amber-strong:#a85a0a;
  --red:#c0392b;--red-bg:#fdf0ef;
  --r:10px;--rs:8px;
  --sh:0 2px 12px rgba(20,70,160,.08);
  --sh-md:0 4px 16px rgba(20,70,160,.12);
  --sh-lg:0 20px 60px rgba(0,0,0,.25);
  --fs:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{font-size:var(--fs);scroll-behavior:smooth}
body{font-family:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
h1,h2,h3,h4{font-weight:900;color:var(--brand);line-height:1.2}
a{color:var(--brand)}
button{font-family:inherit;cursor:pointer;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand-mid);outline-offset:2px}
.muted{color:var(--text3)}
.skip{position:absolute;left:-999px;top:0;background:#fff;color:var(--brand);padding:.6rem 1rem;z-index:400;font-weight:700}
.skip:focus{left:8px;top:8px}

/* top bars */
.sticky-top{position:sticky;top:0;z-index:60}
.topbar{background:linear-gradient(135deg,var(--brand-dark) 0%,var(--brand) 55%,var(--brand-mid) 100%);color:#fff;display:flex;align-items:center;gap:.5rem .7rem;padding:.45rem .9rem;flex-wrap:wrap}
.tb-logo{display:flex;align-items:center;height:40px}
.tb-logo img{height:38px;max-width:140px;object-fit:contain;object-position:left center}
.tb-title{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.tb-title strong{font-weight:900;font-size:1.05rem}
.tb-title span{font-size:.72rem;opacity:.85}
.searchbox{position:relative;flex:1 1 200px;max-width:420px;margin-left:auto}
.searchbox input{width:100%;padding:.5rem .9rem;border-radius:22px;border:0;font-size:.9rem;min-height:38px}
.search-results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;color:var(--text);border-radius:var(--r);box-shadow:var(--sh-lg);max-height:65vh;overflow:auto;z-index:70;min-width:min(420px,90vw)}
.sr-item{display:block;width:100%;text-align:left;background:none;border:0;padding:.6rem .85rem}
.sr-item:hover,.sr-item:focus{background:var(--brand-light)}
.sr-where{font-size:.74rem;color:var(--text3);font-weight:700}
.sr-empty{padding:.8rem .9rem;color:var(--text3)}
mark{background:#cfe0ff;color:inherit;border-radius:3px;padding:0 1px}
.tb-actions{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.tbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:22px;padding:.4rem .85rem;font-size:.82rem;font-weight:700;min-height:38px}
.tbtn:hover{background:rgba(255,255,255,.28)}
.tbtn.on,.tbtn.edit{background:#fff;color:var(--brand)}
.menu-toggle{display:none}
.editbar{background:var(--brand-dark);color:#fff;padding:.4rem .9rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;font-size:.88rem}
.editbar input{flex:1 1 260px;padding:.4rem .75rem;border-radius:8px;border:0;min-height:36px}
.savestate{font-weight:700;white-space:nowrap}
.savestate.err{color:#ffb4ab}
.alertbar{background:var(--red);color:#fff;padding:.5rem .9rem;font-weight:700;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.alertbar a{color:#fff}

/* layout */
.layout{display:grid;grid-template-columns:272px minmax(0,1fr);align-items:start}
.menu{position:sticky;top:var(--stickyh,64px);max-height:calc(100vh - var(--stickyh,64px));overflow:auto;padding:1rem .8rem 2rem}
.menu h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin:.2rem .6rem .5rem}
.menu ul{list-style:none}
.menu li{display:flex;align-items:center;gap:.15rem;border-radius:var(--rs)}
.menu li.dragover{background:var(--brand-light);outline:2px dashed var(--brand-mid)}
.mi{flex:1;display:flex;gap:.55rem;align-items:center;padding:.5rem .7rem;border-radius:var(--rs);color:var(--text);text-decoration:none;font-weight:500;min-height:40px;min-width:0}
.mi:hover{background:var(--brand-light)}
.mi.active{background:var(--brand);color:#fff}
.mi .n{font-weight:900;min-width:1.5em}
.mi.hidden-sec{opacity:.6;font-style:italic}
.mini{background:none;border:0;color:var(--text3);width:30px;height:34px;border-radius:6px;font-size:.85rem}
.mini:hover{background:var(--brand-light);color:var(--brand)}
.menu-note{font-size:.8rem;color:var(--text3);padding:.3rem .7rem}
.main{padding:1rem 1.2rem 5rem;max-width:1120px;width:100%;margin:0 auto;outline:0}
.scrim{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.55rem 1rem;border-radius:var(--rs);border:1.5px solid transparent;font-weight:700;font-size:.9rem;min-height:40px;transition:background .12s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--brand-dark)}
.btn-ghost{background:#fff;color:var(--brand);border-color:var(--border2)}
.btn-ghost:hover:not(:disabled){background:var(--brand-light)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:.3rem .65rem;font-size:.8rem;min-height:34px}
.icon-btn{background:#fff;border:1.5px solid var(--border2);color:var(--brand);border-radius:var(--rs);min-width:34px;min-height:34px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 .4rem}
.icon-btn:hover:not(:disabled){background:var(--brand-light)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.icon-btn.danger{color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:20px;font-size:.76rem;font-weight:700;border:0}
.chip.ok{background:var(--green-bg);color:var(--green-strong)}
.chip.warn{background:var(--amber-bg);color:var(--amber-strong)}
button.chip{cursor:pointer}

/* notice */
.notice{background:var(--brand-light);border-radius:var(--r);padding:.7rem 1rem;display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem;color:var(--brand-dark);font-weight:500}
.notice span{flex:1 1 260px}

/* cover */
.cover{background:var(--surface);border-radius:14px;box-shadow:var(--sh-md);padding:1.4rem;margin-bottom:1.6rem;scroll-margin-top:calc(var(--stickyh,64px) + 10px)}
.cover-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.2rem;flex-wrap:wrap;background:var(--brand);border-radius:12px;padding:.8rem 1.3rem}
.cover-logo{height:68px;max-width:min(300px,60%);object-fit:contain;object-position:left center}
.cover-kicker{font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:.09em;font-size:.9rem}
.cover-main{display:grid;grid-template-columns:minmax(200px,380px) 1fr;gap:1.5rem;align-items:start}
.cover-photo{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;width:100%;border-radius:14px;background:var(--brand-light);overflow:hidden;border:0;position:relative;color:var(--brand);font-weight:700;padding:0}
.cover-photo img{width:100%;height:100%;object-fit:cover;display:block}
button.cover-photo:hover{filter:brightness(.96)}
.cover-photo .hint{position:absolute;left:0;right:0;bottom:0;background:rgba(13,50,120,.85);color:#fff;padding:.45rem;font-size:.82rem}
.cover-photo-wrap .chip{margin-top:.5rem}
.cover h1{font-size:2.3rem;font-weight:900;margin-bottom:.2rem}
.facts{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:.35rem .9rem;margin-top:.9rem;align-items:center}
.facts dt{font-weight:700;color:var(--text2);font-size:.85rem}
.facts dd{min-width:0}
.facts input,.facts select{width:100%;padding:.35rem .55rem;border:1.5px solid var(--border2);border-radius:var(--rs);background:#fff;min-height:38px}
.facts .auto{background:var(--surface2);padding:.35rem .55rem;border-radius:var(--rs)}
.cover-alert{background:var(--red);color:#fff;border-radius:var(--rs);padding:.6rem .8rem;font-weight:700;margin-top:.7rem}
.cover-alert ul{margin:.2rem 0 0 1.1rem;font-weight:500}

/* sections and panels */
.section{margin:2.2rem 0;scroll-margin-top:calc(var(--stickyh,64px) + 10px)}
.sec-head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.7rem}
.sec-head h2{font-size:1.75rem}
.sec-num{background:var(--brand);color:#fff;border-radius:50%;width:2.2rem;height:2.2rem;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:1rem;flex-shrink:0}
.sec-title-input{font:inherit;font-weight:900;font-size:1.4rem;color:var(--brand);border:1.5px solid var(--border2);border-radius:var(--rs);padding:.2rem .6rem;flex:1;min-width:200px;background:#fff}
.sec-tools{display:flex;gap:.35rem;flex-wrap:wrap;margin-left:auto}
.sec-hidden{background:var(--surface3);border-radius:var(--r);padding:.8rem 1rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;color:var(--text2)}
.panel{margin:.9rem 0}
.panel-head{display:flex;align-items:center;gap:.6rem;width:100%;background:var(--brand-light);color:var(--brand);border:0;border-radius:var(--rs);padding:.7rem 1rem;font-weight:900;font-size:1.08rem;text-align:left;min-height:46px}
.panel-head:hover{background:#dbe6f7}
.chev{transition:transform .15s;display:inline-block}
.panel.collapsed .chev{transform:rotate(-90deg)}
.panel.collapsed .panel-body{display:none}
.panel-body{padding:.3rem 0 .2rem}
.panel-empty{color:var(--text3);padding:.6rem .3rem}
.add-slot{display:flex;justify-content:center;margin:.15rem 0}
.add-slot button{background:#fff;border:1.5px dashed var(--border2);color:var(--brand);border-radius:20px;padding:.1rem 1rem;font-weight:700;min-height:30px}
.add-slot button:hover{background:var(--brand-light)}
.deleted-tray{margin:.6rem 0;font-size:.9rem}
.deleted-tray summary{cursor:pointer;color:var(--text2);font-weight:700}
.deleted-tray li{display:flex;gap:.6rem;align-items:center;margin:.3rem 0;list-style:none}

/* blocks */
.block{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:.9rem 1rem .6rem;margin:.5rem 0;scroll-margin-top:calc(var(--stickyh,64px) + 14px)}
body.editing .block{outline:1.5px dashed var(--border2)}
.block.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,40%{background:#cfe0ff}100%{background:var(--surface)}}
.block-bar{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap;margin-bottom:.5rem}
.block-bar .lbl{font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-right:auto}
.block-meta{font-size:.74rem;color:var(--text3);margin-top:.5rem}
.block-title{font-size:1.1rem;margin-bottom:.4rem}
.block-title-input{font:inherit;font-weight:900;font-size:1.05rem;color:var(--brand);border:1.5px solid var(--border2);border-radius:var(--rs);padding:.25rem .55rem;width:100%;margin-bottom:.4rem;background:#fff}
.rich{line-height:1.6;overflow-wrap:anywhere}
.rich p,.rich div{margin:.15rem 0}
.rich ul,.rich ol{margin:.3rem 0 .3rem 1.4rem}
.rich h4{font-size:1rem;margin:.6rem 0 .1rem}
.rte{min-height:3.2rem;border:1.5px solid var(--border2);border-radius:var(--rs);padding:.5rem .7rem;background:#fff}
.rte:focus{border-color:var(--brand);outline:0;box-shadow:0 0 0 3px rgba(20,70,160,.12)}
.rte-tools{display:flex;gap:.35rem;margin-bottom:.4rem;flex-wrap:wrap}

/* tables */
.tbl-wrap{overflow-x:auto;margin:.3rem 0}
table.dt{border-collapse:separate;border-spacing:3px;width:100%}
table.dt th{background:var(--brand-light);color:var(--brand);font-weight:700;text-align:left;padding:.45rem .6rem;border-radius:6px;font-size:.85rem;vertical-align:bottom;white-space:nowrap}
table.dt th .th-in{display:flex;align-items:center;gap:.3rem;justify-content:space-between}
table.dt th .th-label{white-space:normal;min-width:5rem}
table.dt td{background:var(--surface2);border-radius:6px;vertical-align:top;padding:.45rem .6rem;min-width:7rem;overflow-wrap:anywhere}
body.editing table.dt td{padding:.2rem}
table.dt td.ctl,table.dt th.ctl{min-width:0;width:1%;white-space:nowrap;background:transparent;padding:0 .15rem}
table.dt td.t-longtext{min-width:13rem}
table.dt td.t-date{min-width:9.5rem}
table.dt td.t-tick,table.dt td.t-number{min-width:5rem}
table.dt tr.dragging{opacity:.4}
table.dt tr.dragover td{background:#cfe0ff}
table.dt td input:not([type=checkbox]),table.dt td textarea,table.dt td select{width:100%;border:1.5px solid transparent;background:transparent;padding:.35rem .45rem;border-radius:6px;min-height:36px}
table.dt td textarea{resize:vertical;min-height:36px;field-sizing:content;line-height:1.4}
table.dt td input:hover,table.dt td textarea:hover,table.dt td select:hover{border-color:var(--border2);background:#fff}
table.dt td input:focus,table.dt td textarea:focus,table.dt td select:focus{border-color:var(--brand);background:#fff;outline:0;box-shadow:0 0 0 3px rgba(20,70,160,.12)}
table.dt td input[type=checkbox]{width:22px;height:22px;margin:.4rem}
.pre{white-space:pre-wrap}
.stars{display:inline-flex;gap:1px}
.star{background:none;border:0;color:var(--border2);font-size:1.35rem;line-height:1;padding:.1rem .12rem;min-width:30px;min-height:34px}
.star.on{color:var(--brand)}
.stars-static{color:var(--brand);letter-spacing:1px;white-space:nowrap}
.stars-static .off{color:var(--border2)}
.risk{display:inline-block;padding:.15rem .6rem;border-radius:14px;font-weight:700;font-size:.85rem;margin:.3rem .2rem}
.risk.low{background:var(--green-bg);color:var(--green-strong)}
.risk.medium{background:var(--amber-bg);color:var(--amber-strong)}
.risk.high{background:var(--red-bg);color:var(--red)}
.risk.none{color:var(--text3)}
.contact-sum{font-size:.78rem;color:var(--text3);padding:0 .45rem .2rem}
.sig-img{max-height:56px;max-width:180px;display:block}
.tbl-tools{display:flex;gap:.4rem;margin-top:.5rem;flex-wrap:wrap}
.cell-tools{display:flex;gap:.3rem;align-items:center;padding:.2rem 0 0 .3rem}

/* photos, video, files */
.photo-grid{display:grid;gap:.8rem}
.photo-grid.n1{grid-template-columns:minmax(0,640px)}
.photo-grid.n2,.photo-grid.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
.photo-grid.n3,.photo-grid.n5,.photo-grid.n6{grid-template-columns:repeat(3,minmax(0,1fr))}
.ph{display:flex;flex-direction:column;gap:.35rem}
.ph-btn{border:0;background:var(--surface3);border-radius:var(--rs);padding:0;overflow:hidden;display:block;aspect-ratio:4/3}
.ph-btn img{width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{font-size:.9rem}
.ph input{width:100%;padding:.3rem .5rem;border:1.5px solid var(--border2);border-radius:6px;font-size:.85rem;min-height:34px}
.ph label{font-size:.7rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.video-wrap video{width:100%;max-width:760px;border-radius:var(--rs);background:#000;display:block}
.print-poster{display:none}
.file-row{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.file-icon{background:var(--brand-light);color:var(--brand);font-weight:900;border-radius:var(--rs);padding:.7rem .6rem;font-size:.8rem;min-width:52px;text-align:center}
.caption-input{margin-top:.4rem;width:100%;padding:.4rem .6rem;border:1.5px solid var(--border2);border-radius:var(--rs);min-height:38px}

/* version log */
.logsec{margin:2.2rem 0;scroll-margin-top:calc(var(--stickyh,64px) + 10px)}
.log-filters{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end;margin:.6rem 0}
.log-filters label{display:flex;flex-direction:column;font-size:.72rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;gap:.15rem}
.log-filters select,.log-filters input{padding:.4rem .5rem;border:1.5px solid var(--border2);border-radius:var(--rs);min-height:38px;background:#fff;text-transform:none;letter-spacing:0;font-weight:400;font-size:.9rem}
table.lg{border-collapse:separate;border-spacing:3px;width:100%;font-size:.85rem}
table.lg th{background:var(--brand-light);color:var(--brand);padding:.4rem .5rem;text-align:left;border-radius:6px;white-space:nowrap}
table.lg td{background:var(--surface);padding:.4rem .5rem;border-radius:6px;vertical-align:top}
table.lg tr:nth-child(even) td{background:var(--surface2)}
.log-note{font-size:.85rem;color:var(--text2);margin:.3rem 0}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.6rem}
.diff pre{background:var(--surface2);border-radius:var(--rs);padding:.6rem;white-space:pre-wrap;font-family:inherit;font-size:.85rem;max-height:40vh;overflow:auto}
.diff h4{font-size:.85rem;margin-bottom:.2rem}

/* modal, toast, lightbox */
.overlay{position:fixed;inset:0;background:rgba(10,20,50,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;overflow:auto}
.modal{background:#fff;border-radius:14px;box-shadow:var(--sh-lg);width:100%;max-width:540px;max-height:92vh;overflow:auto;padding:1.2rem 1.3rem}
.modal.wide{max-width:900px}
.modal h3{font-size:1.25rem;margin-bottom:.7rem}
.modal .m-actions{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1rem}
.field{display:flex;flex-direction:column;gap:.2rem;margin:.55rem 0}
.field label{font-size:.78rem;font-weight:700;color:var(--text2)}
.field input,.field select,.field textarea{padding:.5rem .65rem;border:1.5px solid var(--border2);border-radius:var(--rs);min-height:40px;background:#fff}
.field textarea{min-height:90px}
.field label.check{flex-direction:row;display:flex;gap:.6rem;align-items:flex-start;font-size:.95rem;font-weight:400;color:var(--text)}
.field label.check input{width:22px;height:22px;min-height:0;flex-shrink:0}
.pick-list{display:grid;gap:.4rem}
.pick{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--rs);padding:.6rem .8rem;width:100%;min-height:48px}
.pick:hover{background:var(--brand-light);border-color:var(--brand-mid)}
.pick strong{color:var(--brand)}
.pick small{color:var(--text3)}
.type-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem}
.type-grid .pick{align-items:center;text-align:center;min-height:84px;justify-content:center;font-weight:700}
.type-grid .ico{font-size:1.6rem}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--brand-dark);color:#fff;padding:.55rem 1.1rem;border-radius:24px;font-weight:700;box-shadow:var(--sh-md);z-index:300;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:250;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;color:#fff}
.lightbox img{max-width:96vw;max-height:78vh;object-fit:contain;border-radius:6px}
.lightbox .lb-cap{margin-top:.7rem;max-width:90vw;text-align:center}
.lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.2);border:0;color:#fff;font-size:2rem;width:54px;height:80px;border-radius:10px}
.lightbox .lb-prev{left:10px}.lightbox .lb-next{right:10px}
.lightbox .lb-close{position:absolute;top:12px;right:14px;background:rgba(255,255,255,.2);border:0;color:#fff;font-size:1.4rem;width:46px;height:46px;border-radius:50%}
.crop-box{touch-action:none;cursor:grab;width:min(100%,360px);aspect-ratio:1/1;margin:.4rem auto;border-radius:10px;background:var(--surface3);display:block}
.sig-pad{touch-action:none;border:1.5px solid var(--border2);border-radius:var(--rs);background:#fff;width:100%;height:160px;display:block}

/* accessibility */
body.hc{--text:#000;--text2:#000;--text3:#1a1a1a;--border:#000;--border2:#000;--bg:#fff;--surface2:#fff;--surface3:#fff;--brand-light:#fff;--brand:#0a2a66;--brand-dark:#000}
body.hc .block,body.hc table.dt td,body.hc table.dt th,body.hc table.lg td,body.hc table.lg th,body.hc .panel-head,body.hc .cover{outline:2px solid #000}
body.hc .topbar{background:#000}
body.hc a{text-decoration:underline}

  a{color:inherit;text-decoration:none}
}

/* ── small utilities ── */

const uid = p => p + '-' + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 7);
const clone = o => (o === undefined ? undefined : structuredClone(o));
const nowISO = () => new Date().toISOString();

const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  let value;
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'value') value = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'checked' || k === 'disabled' || k === 'selected' || k === 'hidden') e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }

function stripHtml(html) { const d = document.createElement('div'); d.innerHTML = html || ''; return d.textContent.replace(/\s+/g, ' ').trim(); }
const ALLOWED_TAGS = new Set(['P', 'BR', 'B', 'STRONG', 'I', 'EM', 'UL', 'OL', 'LI', 'H4', 'DIV']);
function sanitize(html) {
  const doc = new DOMParser().parseFromString('<body>' + (html || '') + '</body>', 'text/html');
  (function walk(node) {
    for (const ch of Array.from(node.childNodes)) {
      if (ch.nodeType === 1) {
        if (['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED'].includes(ch.tagName)) { ch.remove(); continue; }
        walk(ch);
        if (!ALLOWED_TAGS.has(ch.tagName)) { ch.replaceWith(...Array.from(ch.childNodes)); }
        else { for (const a of Array.from(ch.attributes)) ch.removeAttribute(a.name); }

}

/* ── ready-made tables ──

  { key: 'evac', title: 'Emergency evacuation plan', sec: 'risk', panel: 'know', cols: [c('Need during evacuation', L), c('Support required', L), c('Equipment'), c('Staff needed'), c('Assembly point')] },
  { key: 'missing', title: 'Missing person information', sec: 'risk', panel: 'know', cols: [c('Item'), c('Detail', L)],
    rows: ['Description', 'Places I may go', 'What to do if I am not back', 'Consent to share a photo with police'].map(x => [x]) },
  { key: 'behaviours', title: 'Behaviour and what it may mean', sec: 'behaviour', panel: 'know', cols: [c('Behaviour', L), c('Likely triggers', L), c('What it may be communicating', L), c('Early warning signs', L)] },
  { key: 'strategies', title: 'Support strategies', sec: 'behaviour', panel: 'like', cols: [dd('Stage', ['Prevent', 'Respond', 'After']), c('What staff do', L), c('What staff avoid', L)] },

  { key: 'people', title: 'People who matter to me', sec: 'relationships', panel: 'know', cols: [c('Name'), c('Relationship'), c('How we keep in touch', L), c('Support needed', L), c('Notes', L)] },

const CONTACT_COLIDS = ['name', 'role', 'organisation', 'phone', 'email', 'involvement', 'shareInfo', 'lastContact'];

/* ── builders ── */
const blankFor = col => (col.type === 'tick' ? false : (col.type === 'rating' ? 0 : ''));
function baseBlock(type, by) {
  const t = nowISO();
  return { id: uid('blk'), type, order: 0, deleted: false, createdBy: by || 'System', createdAt: t, updatedBy: by || 'System', updatedAt: t };
}
function makeTableBlock(t, by) {
  const columns = t.cols.map((x, i) => {
    const col = { id: x.id || (t.bound ? CONTACT_COLIDS[i] : uid('c')), label: x.label, type: x.type };
    if (x.options) col.options = [...x.options];
    if (x.max) col.max = x.max;
    if (x.calc) col.calc = x.calc;
    if (x.sig) col.sig = true;
    return col;
  });

  b.title = t.title; b.templateKey = t.key; b.columns = columns;
  if (t.bound) { b.bound = t.bound; b.rows = []; }
  else b.rows = (t.rows && t.rows.length ? t.rows : [[]]).map(vals => makeRow(columns, vals));

}
function makeRow(columns, vals = []) {

  columns.forEach((col, i) => { cells[col.id] = vals[i] !== undefined ? vals[i] : blankFor(col); });
  return { id: uid('r'), cells };
}

/* ── Storage interface (Phase 1: IndexedDB in this browser) ──
   loadPlan / savePlan / uploadFile / fetchFile / addLog (+ listLog).
   There is deliberately no updateLog or deleteLog. Phase 2 replaces this
   object with one that calls the online service. */
const Storage = (() => {
  const DB = 'cs-support-plan-sample';
  let db = null;
  const mem = { kv: new Map(), files: new Map(), log: [] };
  const open = () => new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB is not available'));
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('files'); d.createObjectStore('log', { autoIncrement: true }); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('Storage is blocked by another tab'));
  });
  const tx = (store, mode, fn) => new Promise((res, rej) => {

    const m = modal({
      title: 'Crop to a square', body: [h('p', { class: 'muted' }, 'Drag the picture to move it. Use the slider to zoom.'), cv, field('Zoom', zoom)],
      actions: [{ label: 'Cancel' }, { label: 'Use this crop', kind: 'primary', run: async () => {

    const orig = m.close; m.close = () => { orig(); if (!chosen) resolve(null); };
  });
}

}

/* ── video ── */
async function importVideo(file) {
  const lim = S.plan.settings.maxVideoMB;
  if (!/^video\/(mp4|webm)$/.test(file.type) && !/\.(mp4|webm)$/i.test(file.name)) throw new Error('Please choose an MP4 or WebM video.');
  if (file.size > lim * 1048576) throw new Error(`This video is ${fmtSize(file.size)} and the limit is ${lim} MB. You can change the limit in Settings.`);
  const mime = file.type || (/\.webm$/i.test(file.name) ? 'video/webm' : 'video/mp4');
  const b = busy('Saving the video and making its poster picture...');
  try {
    const poster = await videoPoster(file);
    return await Media.add({ kind: 'video', blob: new Blob([file], { type: mime }), fileName: file.name, mimeType: mime, poster });
  } finally { b.done(); }
}

/* ═══ TABLES ═══ */
const cellGet = (block, row, col) => { const v = block.bound ? row[col.id] : row.cells[col.id]; return v === undefined || v === null ? blankFor(col) : v; };
const cellSet = (block, row, col, v) => { if (block.bound) row[col.id] = v; else row.cells[col.id] = v; };
const contactName = ct => ct.name || '(unnamed contact)';
const contactSum = ct => [ct.role, ct.phone].filter(Boolean).join(', ');
let dragRow = null;

/* a change that happens in one go: snapshot, change, log with before and after, redraw */
function rowOp(loc, action, summary, fn) {
  Log.flushAll();
  const before = Log.snapBlock(loc.block.id);
  fn();
  touchBlock(loc.block);
  Log.event(ctxOf(loc), action, summary, { before, after: Log.snapBlock(loc.block.id) });
  rerenderBlock(loc.block.id);
}
const tname = b => b.title || 'Table';

function riskOf(block, row) {
  const lc = colByLabel(block, /^likelihood/i), sc = colByLabel(block, /^severity/i);
  const l = +(lc && row.cells[lc.id]) || 0, s = +(sc && row.cells[sc.id]) || 0;
  if (!l || !s) return null;
  const score = l * s;
  return { score, level: score >= 15 ? 'High' : score >= 5 ? 'Medium' : 'Low' };
}
function updateRisk(block, row, tr) {
  const rc = block.columns.find(cl => cl.calc === 'risk'); if (!rc) return;
  const r = riskOf(block, row); row.cells[rc.id] = r ? r.level : '';
  const chip = tr && tr.querySelector('.risk'); if (chip) { chip.className = 'risk ' + (r ? r.level.toLowerCase() : 'none'); chip.textContent = r ? `${r.score}: ${r.level}` : 'Set likelihood and severity'; }
}

  const trh = h('tr');

  block.columns.forEach(col => {
    const inner = h('div', { class: 'th-in' }, h('span', { class: 'th-label' }, col.label));
    if (ui.edit && !bound) inner.append(h('button', { class: 'icon-btn', type: 'button', 'aria-label': `Settings for column ${col.label}`, title: 'Column settings', onclick: () => openColumnDialog(loc, col) }, '⋮'));

async function demoPicture(name, w, h) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('A demo picture could not be drawn')); i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(DEMO_ART[name]); });
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(img, 0, 0, w, h);
  return canvasBlob(cv, 'image/jpeg', 0.85);
}
function demoPdf() {
  const esc = s => s.replace(/([()\\])/g, '\\$1');
  const lines = ['DEMO ONLY (fictional)', '', 'Mental capacity assessment: managing money', 'Person: Leslie Example', 'Date: 12 May 2026', 'Assessed by: Pat Sample, social worker', 'Outcome: lacks capacity for this decision.', 'Best interests: staff keep money safe, Leslie chooses what to buy.', '', 'This is an example document made inside the page.'];
  const content = 'BT /F1 14 Tf 56 780 Td 22 TL\n' + lines.map(l => '(' + esc(l) + ') Tj T*').join('\n') + '\nET';
  const objs = ['<< /Type /Catalog /Pages 2 0 R >>', '<< /Type /Pages /Kids [3 0 R] /Count 1 >>', '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>', '<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream', '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'];
  let out = '%PDF-1.4\n'; const offs = [];
  objs.forEach((o, i) => { offs.push(out.length); out += (i + 1) + ' 0 obj\n' + o + '\nendobj\n'; });
  const xref = out.length;
  out += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n' + offs.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('') + 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF';
  return new Blob([out], { type: 'application/pdf' });
}

/* Fills the cover, every table, contacts, text, pictures, a video, a PDF and an extra section.
   Safe to run again: blocks and the section added by an earlier run are replaced. */
async function applyDemo() {
  const realUser = ui.user; let failedCount = 0;
  Log.commit();
  ui.user = { name: DEMO_BY, manager: false };
  try {
    // 1. clear what an earlier run added
    S.sections = S.sections.filter(s => !s.demoSection);
    S.sections.forEach(sec => sec.panels.forEach(p => { p.blocks = p.blocks.filter(b => !b.demo); }));
    // 2. cover facts
    Object.assign(S.plan, { preferredName: 'Leslie', fullName: 'Leslie Example (fictional)', dob: '2008-03-14', address: '1 Example Road, Sampletown, AB1 2CD', movedIn: '2025-01-06', commLine: 'Uses Makaton signs, picture cards and short phrases', funder: 'Example Borough Council', keyWorkerRowId: '', managerRowId: '', demo: true });
    // 3. contacts, stored once
    const ids = {};
    S.contacts = Object.entries(DEMO_CONTACTS).map(([k, v]) => { const ct = Object.assign(makeContact(), v); ids[k] = ct.id; return ct; });
    // 4. table rows
    for (const [key, list] of Object.entries(DEMO_ROWS)) {
      allBlocks(b => b.templateKey === key && !b.bound).forEach(({ block }) => {
        block.rows = list.map(vals => makeRow(block.columns, vals.map((v, i) => (block.columns[i] && block.columns[i].type === 'contact' && ids[v] ? ids[v] : v))));
        block.updatedBy = DEMO_BY; block.updatedAt = nowISO();
        if (block.columns.some(cl => cl.calc === 'risk')) block.rows.forEach(r => updateRisk(block, r, null));
      });
    }
    const dir = firstByTemplate('contacts'); if (dir) { dir.updatedBy = DEMO_BY; dir.updatedAt = nowISO(); }
    // 5. pictures, video, file, text. A picture that cannot be made on this device is skipped, never fatal.
    const failed = [];
    const safe = async fn => { try { return await fn(); } catch (e) { console.warn('Demo content:', e); failed.push(e.message); return null; } };
    const consent = () => ({ recorded: true, agreedBy: 'Demo data, not a real person', date: todayStr() });
    await safe(async () => {
      const m = await Media.add({ kind: 'image', blob: await demoPicture('cover', 1200, 1200), fileName: 'demo-cover.jpg', mimeType: 'image/jpeg' });
      m.consent = consent(); S.plan.coverPhotoMediaId = m.id;
    });
    const pics = [];
    for (const [name, caption, alt, withConsent] of [
      ['park', 'Swinging at the park, my favourite place', 'A drawing of a swing and a tree in a park', true],
      ['baking', 'Baking cupcakes with Jo', 'A drawing of three cupcakes on a tray', true],
      ['bus', 'Waiting for the bus to the shops (consent not yet recorded, to show the warning)', 'A drawing of a red bus at a bus stop', false]]) {
      await safe(async () => {
        const m = await Media.add({ kind: 'image', blob: await demoPicture(name, 800, 600), fileName: 'demo-' + name + '.jpg', mimeType: 'image/jpeg' });
        if (withConsent) m.consent = consent();
        pics.push({ mediaId: m.id, caption, alt });
      });
    }
    const vid = await safe(async () => {
      const webm = await (await fetch('data:video/webm;base64,' + DEMO_WEBM_B64)).blob();
      const poster = await videoPoster(webm).catch(() => null);
      const m = await Media.add({ kind: 'video', blob: webm, fileName: 'demo-bus-practice.webm', mimeType: 'video/webm', poster });
      m.consent = consent(); return m;
    });
    const pdf = await safe(() => Media.add({ kind: 'file', blob: demoPdf(), fileName: 'demo-capacity-assessment.pdf', mimeType: 'application/pdf' }));
    failedCount = failed.length;
    const mk = (type, props) => Object.assign(baseBlock(type, DEMO_BY), { demo: true }, props);
    const put = (secKey, panelKey, block, atStart) => {
      const sec = S.sections.find(s => s.key === secKey && !s.deleted); if (!sec) return;
      const p = panelOf(sec, panelKey); if (atStart) p.blocks.unshift(block); else p.blocks.push(block);
    };
    put('about', 'know', mk('text', { html: '<p><b>Hello, I am Leslie.</b> I love animals, music and baking. This plan is written with me, so you know how I like to be supported.</p><h4>What people like about me</h4><ul><li>I am funny and kind</li><li>I never give up when I am learning something new</li><li>I give the best hugs when I am ready</li></ul>' }), true);
    if (pics.length) put('about', 'know', mk('image', { items: pics }));
    put('about', 'like', mk('text', { html: '<h4>Things that help me feel calm</h4><ul><li>My headphones and my favourite playlist</li><li>The weighted blanket on the sofa</li><li>Looking at photos of Biscuit</li><li>A drink of squash with ice</li></ul>' }), true);
    if (pdf) put('decisions', 'know', mk('file', { mediaId: pdf.id, name: 'Capacity assessment: managing money (demo)', date: '2026-05-12' }));
    if (vid) put('goals', 'further', mk('video', { mediaId: vid.id, caption: 'Practising the bus route with Sam (demo cartoon)' }));
    put('daily', 'like', mk('text', { html: '<h4>My morning routine</h4><ol><li>Wake up and say good morning (sign "morning")</li><li>Choose my clothes from two outfits</li><li>Wash and clean my teeth</li><li>Breakfast: banana and toast</li><li>Check the picture timetable for the day</li></ol>' }), true);
    // 6. an extra section, to show that a new section gets the same three headings
    const sec = { id: uid('sec'), key: 'custom', title: 'School and college', order: 0, isDefault: false, visible: true, deleted: false, demoSection: true, panels: makePanels() };
    const tcols = ['Day', 'Class', 'Support needed'].map(l => ({ id: uid('c'), label: l, type: 'text' }));
    const tt = mk('table', { title: 'College timetable', templateKey: null, columns: tcols, rows: [['Tuesday', 'Art and music', 'Travel with a support worker'], ['Thursday', 'Art club', 'Support worker nearby']].map(v => makeRow(tcols, v)) });
    sec.panels[0].blocks.push(mk('text', { html: '<p>Leslie goes to <b>Example College</b> on Tuesday and Thursday mornings. This section was added to show that new sections get the same three headings.</p>' }), tt);
    sec.panels[1].blocks.push(mk('text', { html: '<ul><li>Tell the tutor about my headphones</li><li>Sit near the door so I can leave if it gets loud</li></ul>' }));
    const rev = S.sections.findIndex(s => s.key === 'review' && !s.deleted);
    S.sections.splice(rev >= 0 ? rev : S.sections.length, 0, sec);
  } finally { ui.user = realUser; }
  Log.event({}, 'demo_loaded', 'Fictional demo content loaded: cover, every table, contacts, text, pictures, a video, a PDF and a College section');
  return failedCount;
}

  $('#btnUser').onclick = async () => { await askUser(true); renderAll(); };
  $('#btnSettings').onclick = settingsDialog; $('#btnBackup').onclick = backupDialog; $('#btnPrint').onclick = printPlan;
  $('#btnTextMinus').onclick = () => { prefs.fs = Math.max(12, prefs.fs - 2); savePrefs(); applyPrefs(); };
  $('#btnTextPlus').onclick = () => { prefs.fs = Math.min(24, prefs.fs + 2); savePrefs(); applyPrefs(); };
  $('#btnContrast').onclick = () => { prefs.hc = !prefs.hc; savePrefs(); applyPrefs(); };
  $('#btnMenu').onclick = () => document.body.classList.toggle('menu-open'); $('#scrim').onclick = () => document.body.classList.remove('menu-open');
  $('#search').addEventListener('input', debounce(runSearch, 150));
  $('#search').addEventListener('keydown', e => { if (e.key === 'Escape') { $('#searchResults').hidden = true; e.target.blur(); } if (e.key === 'Enter') { const f = $('#searchResults .sr-item'); if (f) f.click(); } });
  document.addEventListener('click', e => { if (!e.target.closest('.searchbox')) $('#searchResults').hidden = true; });
  window.addEventListener('pagehide', flushNow);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushNow(); });
  window.addEventListener('beforeprint', enterPrintMode); window.addEventListener('afterprint', leavePrintMode);
  if ('ResizeObserver' in window) new ResizeObserver(setStickyHeight).observe($('#sticky'));
  window.addEventListener('resize', setStickyHeight);
  window.__plan = { get S() { return S; }, get LOG() { return LOG; }, ui, Storage }; // handy for testing in the console
}
init().catch(e => { console.error(e); document.body.prepend(h('p', { style: 'padding:1rem;color:#c0392b' }, 'The page could not start: ' + e.message)); });
</script>
</body>
